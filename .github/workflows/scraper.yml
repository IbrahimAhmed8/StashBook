name: Scraper

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  # Needed by actions/cache to restore and save the engine database.
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: stashbook-engine/go.mod
          cache-dependency-path: stashbook-engine/go.sum

      # The engine keeps working state (expired offers, tracked prices) in
      # stashbook.db. The database is not committed anymore; it is restored
      # from the previous run's cache instead. The key is unique per run so
      # the updated database is saved again afterwards, while restore-keys
      # falls back to the most recent cache. A cold start (no cache) still
      # works: the engine recreates the schema and repopulates the current
      # offers; only accumulated history is lost.
      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: stashbook-engine/stashbook.db
          key: stashbook-db-${{ github.run_id }}
          restore-keys: |
            stashbook-db-

      - name: Run aggregation engines
        working-directory: stashbook-engine
        run: go run main.go

      - name: Commit and push updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/games.json public/books.json public/sitemap.xml
          git diff --staged --quiet || (git commit -m "chore: auto-update assets" && git pull --rebase --autostash origin main && git push)