name: Scraper

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: stashbook-engine/go.mod
          cache-dependency-path: stashbook-engine/go.sum

      - name: Run aggregation engines
        working-directory: stashbook-engine
        run: go run main.go

      - name: Commit and push updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/games.json public/books.json stashbook-engine/stashbook.db
          git diff --staged --quiet || (git commit -m "chore: auto-update assets" && git pull --rebase origin main && git push)
