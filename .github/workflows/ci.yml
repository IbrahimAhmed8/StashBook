name: CI

# Runs on pull requests only. The scheduled scraper job lives in
# scraper.yml and is unaffected by this file.
on:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stashbook-engine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: stashbook-engine/go.mod
          cache-dependency-path: stashbook-engine/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build